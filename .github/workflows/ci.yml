name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gofmt has always been the rule (AGENTS.md, "Writing code") and
      # until 2026-10-13 nothing checked it. gofmt -l prints the files that
      # differ from its formatting and nothing when they all match.
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      # Unit tests only - acceptance tests (TF_ACC=1) need a live nxip API,
      # which this repo has no way to stand up on its own now that it's
      # split out of net-saas-monorepo. See that repo's extraction commit
      # for the open question on how full acceptance coverage gets run.
      - name: Unit tests
        run: go test ./...

      - name: Audit Go module for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
